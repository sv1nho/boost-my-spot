name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-code:
    name: Quality code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code and unused dependencies
        run: npm run knip

  build:
    name: Build
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boost_my_spot
          POSTGRES_PASSWORD: boost_my_spot
          POSTGRES_DB: boost_my_spot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: First load budget
        run: npm run size

      - name: Boot what production would install, and call it
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://boost_my_spot:boost_my_spot@127.0.0.1:5432/boost_my_spot
          API_HOST: 127.0.0.1
          API_PORT: '3401'
          WEB_ORIGIN: https://boostmyspot.example
          BETTER_AUTH_URL: https://boostmyspot.example
          BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session
          GOOGLE_CLIENT_ID: ci-only-not-a-real-client
          GOOGLE_CLIENT_SECRET: ci-only-not-a-real-secret
        run: |
          npm ci --omit=dev --omit=optional --ignore-scripts

          node dist/api/server/index.js &
          booted=$!

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3401/api/health -o health.json; then break; fi
            sleep 1
          done

          echo "health: $(cat health.json)"
          grep -q '"database":"up"' health.json

          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3401/)" = 200
          curl -fsS http://127.0.0.1:3401/server/index.js | grep -q '<!doctype html>'

          kill "$booted" || true

  unit-test:
    name: Unit test
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boost_my_spot
          POSTGRES_PASSWORD: boost_my_spot
          POSTGRES_DB: boost_my_spot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://boost_my_spot:boost_my_spot@127.0.0.1:5432/boost_my_spot
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the migrations still describe the schema
        run: npm run db:check

      - name: Test, with the coverage thresholds
        run: npm test

  e2e:
    name: E2E
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boost_my_spot
          POSTGRES_PASSWORD: boost_my_spot
          POSTGRES_DB: boost_my_spot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://boost_my_spot:boost_my_spot@127.0.0.1:5432/boost_my_spot
      WEB_ORIGIN: http://127.0.0.1:3101
      BETTER_AUTH_URL: http://127.0.0.1:3101
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run e2e

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-results
          path: e2e/.results
          include-hidden-files: true
          retention-days: 7

  code-scan:
    name: Code scan
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Load the queries
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Look for what they describe
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Audit what production ships
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Audit the tooling, without blocking on it
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
