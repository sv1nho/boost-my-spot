name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: sv1nho/ci/.github/workflows/pipeline.yml@ba4a51a36d98ace6e55cdb44357c0e37c6bc21f9
    with:
      e2e_base_url: http://127.0.0.1:3101
    secrets: inherit
