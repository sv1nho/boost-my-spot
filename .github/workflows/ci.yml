name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: sv1nho/ci/.github/workflows/pipeline.yml@af57c51fa73ed561837160fdd8a2980ad08d0a96
    with:
      e2e_base_url: http://127.0.0.1:3101
    secrets: inherit
